[profile.default]
src = "tests/evm"
test = "tests/evm"
out = "out"
libs = ["node_modules", "vendor"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = [
  "contracts/implementations/PrivacyPoolSimple.sol=vendor/0xbow-privacy-pools-core-v1.2.1/contracts-src/contracts/implementations/PrivacyPoolSimple.sol",
  "contracts/PrivacyPool.sol=vendor/0xbow-privacy-pools-core-v1.2.1/contracts-src/contracts/PrivacyPool.sol",
  "contracts/State.sol=vendor/0xbow-privacy-pools-core-v1.2.1/contracts-src/contracts/State.sol",
  "contracts/lib/Constants.sol=vendor/0xbow-privacy-pools-core-v1.2.1/contracts-src/contracts/lib/Constants.sol",
  "contracts/lib/ProofLib.sol=vendor/0xbow-privacy-pools-core-v1.2.1/contracts-src/contracts/lib/ProofLib.sol",
  "interfaces/IPrivacyPool.sol=vendor/0xbow-privacy-pools-core-v1.2.1/contracts-src/interfaces/IPrivacyPool.sol",
  "interfaces/IState.sol=vendor/0xbow-privacy-pools-core-v1.2.1/contracts-src/interfaces/IState.sol",
  "interfaces/IEntrypoint.sol=vendor/0xbow-privacy-pools-core-v1.2.1/contracts-src/interfaces/IEntrypoint.sol",
  "interfaces/IVerifier.sol=vendor/0xbow-privacy-pools-core-v1.2.1/contracts-src/interfaces/IVerifier.sol",
  "@oz/interfaces/IERC20.sol=node_modules/@openzeppelin/contracts/interfaces/IERC20.sol",
  "lean-imt/InternalLeanIMT.sol=node_modules/@zk-kit/lean-imt.sol/InternalLeanIMT.sol",
  "poseidon/PoseidonT3.sol=node_modules/poseidon-solidity/PoseidonT3.sol",
  "poseidon/PoseidonT4.sol=node_modules/poseidon-solidity/PoseidonT4.sol",
  "poseidon-solidity/PoseidonT3.sol=node_modules/poseidon-solidity/PoseidonT3.sol",
  "poseidon-solidity/PoseidonT4.sol=node_modules/poseidon-solidity/PoseidonT4.sol",
]
